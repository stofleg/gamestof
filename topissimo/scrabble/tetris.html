<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grille Tetris · Topissimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css?v=376">
<style>
  body { margin: 0; --cell-size-plateau: clamp(20px, calc((100vh - 120px) / 15.5), 36px); --cell-size: var(--cell-size-plateau); }
  .pz-top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
  .pz-top h1 { font-family: 'Lora', serif; font-size: 1.3rem; margin: 0; color: var(--petrol); }
  .pz-chrono { font: 700 1.3rem/1 'Inter', sans-serif; color: var(--petrol); font-variant-numeric: tabular-nums; }
  .pz-msg { font: 500 .95rem 'Inter', sans-serif; color: #1f6b47; }
  .pz-top .sp { flex: 1; }
  .pz-btn { font: 600 .9rem 'Inter', sans-serif; padding: 8px 14px; border-radius: 8px; border: 0;
    background: var(--petrol); color: #fff; cursor: pointer; }
  .pz-btn.ghost { background: transparent; color: var(--petrol); border: 1px solid var(--petrol); }
  .pz-main { display: flex; gap: 18px; padding: 0 16px 16px; align-items: flex-start; }
  .pz-tray { flex: 1; min-height: calc(15 * var(--cell-size) + 16px); display: flex; flex-wrap: wrap;
    gap: 14px; align-content: flex-start; padding: 12px; border-radius: 12px;
    background: rgba(0,46,68,.06); }
  /* pièce : un petit plateau dont seules les cases de la pièce sont visibles */
  .board.piece { width: auto !important; height: auto !important; padding: 0; background: transparent !important; border: 0 !important; box-shadow: none !important; border-radius: 0;
    cursor: grab; touch-action: none; }
  .board.piece td.trou { background: transparent !important; border-color: transparent !important; }
  .board.piece td.trou::before, .board.piece td.trou::after { content: none !important; }
  .board.piece td:not(.trou) { box-shadow: inset 0 0 0 1px rgba(0,46,68,.35); }
  .pz-tray .board.piece { --cell-size: calc(var(--cell-size-plateau) * .8); }
  .board.piece.drag { position: fixed; z-index: 1000; pointer-events: none; opacity: .9;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
  #pzBoard td.vide { background: #f6f3ea !important; }
  #pzBoard td.vide::before, #pzBoard td.vide::after { content: none !important; }
  #pzBoard td.posee { cursor: grab; }
  #pzBoard.gagne { outline: 4px solid #2f9e5c; }
  .tt-side { display: flex; flex-direction: column; gap: 12px; width: 240px; }
  .tt-box { background: rgba(0,46,68,.06); border-radius: 12px; padding: 10px 12px; font-family: 'Inter', sans-serif; }
  .tt-lab { font-size: .8rem; color: var(--petrol); opacity: .7; margin-bottom: 6px; }
  .tt-big { font: 700 1.4rem 'Inter', sans-serif; color: var(--petrol); }
  .tt-aide { font: .82rem/1.5 'Inter', sans-serif; color: var(--petrol); opacity: .8; }
  #ttNext .board.piece { --cell-size: calc(var(--cell-size-plateau) * .8); }
  #pzBoard td.chute { outline: 2px solid #f0b400; outline-offset: -2px; }
  #pzBoard.rate { outline: 4px solid #cc4040; }
</style>
</head>
<body>
  <div class="pz-top">
    <h1>🟦 Grille Tetris</h1>
    <span class="pz-chrono" id="pzChrono">0:00</span>
    <span class="pz-msg" id="pzMsg">Génération de la grille…</span>
    <span class="sp"></span>
    <button class="pz-btn ghost" id="pzNew" disabled>Nouvelle grille</button>
    <button class="pz-btn ghost" onclick="location.href='game.html'">Retour</button>
  </div>
  <div class="pz-main">
    <div class="board" id="pzBoard"></div>
    <div class="tt-side">
      <div class="tt-box"><div class="tt-lab">Pièce suivante</div><div id="ttNext"></div></div>
      <div class="tt-box"><div class="tt-lab">Pièces</div><div class="tt-big" id="ttCompte">–</div></div>
      <div class="tt-box"><div class="tt-lab">Essais ratés</div><div class="tt-big" id="ttEchecs">0</div></div>
      <button class="pz-btn" id="ttRelance" disabled>Recommencer la grille</button>
      <div class="tt-aide">← → déplacer · ↑ tourner · ↓ descendre · Espace : lâcher<br>Le chrono continue quand on recommence.</div>
    </div>
  </div>
<script type="module" src="tetris.js?v=376"></script>
</body>
</html>
