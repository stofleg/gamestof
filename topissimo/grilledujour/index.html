<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grille du jour · Topissimo</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../style.css?v=374">
<style>
  .gdj-wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .gdj-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .gdj-top h1 { margin: 0; font-size: 1.5rem; }
  .gdj-sub { color: var(--ink-soft); font-size: .9rem; }
  .gdj-cols { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .gdj-cols { grid-template-columns: 1fr; } }

  /* Plateau : finition « DupliJeu » de Topissimo (game.css, body.theme-duplijeu) :
     fond blanc, traits gris-bleu, cases bonus pleines avec quatre triangles
     débordants, jetons tan unis cernés de noir, lettres sans empattement. */
  .gdj-wrap { --cell: clamp(18px, calc((100vw - 56px) / 15.5), 34px);
    --petrol:#002E44; --tile-pending:#b3e5b3; --tile-pending-2:#8cd08c;
    --bonus-dl:#a4d8e1; --bonus-tl:#3a8db5; --bonus-dw:#f0a8a8; --bonus-tw:#cc4040; }
  /* deux colonnes : le plateau partage la largeur avec la liste (≈ 320 px) */
  @media (min-width: 761px) { .gdj-wrap { --cell: clamp(22px, calc((min(100vw, 980px) - 420px) / 15.5), 36px); } }
  .gdj-board { background: #fff; padding: 8px; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,46,68,.15); display: inline-block; }
  .gdj-board table { border-collapse: collapse; table-layout: fixed;
    width: calc(15 * var(--cell) + 16px); }
  .gdj-board td { width: var(--cell); min-width: var(--cell); max-width: var(--cell);
    height: var(--cell); padding: 0; text-align: center; position: relative;
    border: 1px solid #b3c1ce; background: #fff; }
  .gdj-board td.dl { background: var(--bonus-dl); }
  .gdj-board td.tl { background: var(--bonus-tl); }
  .gdj-board td.dw, .gdj-board td.center { background: var(--bonus-dw); }
  .gdj-board td.tw { background: var(--bonus-tw); }
  .gdj-board td.dl, .gdj-board td.tl, .gdj-board td.dw,
  .gdj-board td.tw, .gdj-board td.center { overflow: visible; z-index: 1; }
  .gdj-board td.dl::after, .gdj-board td.tl::after, .gdj-board td.dw::after,
  .gdj-board td.tw::after, .gdj-board td.center::after {
    content: ""; position: absolute; inset: calc(var(--cell) * -0.13);
    background: no-repeat center / 100% 100%; pointer-events: none; z-index: 0; }
  .gdj-board td.dl::after { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23a4d8e1'><polygon points='40,12 60,12 50,0'/><polygon points='40,88 60,88 50,100'/><polygon points='12,40 12,60 0,50'/><polygon points='88,40 88,60 100,50'/></g></svg>"); }
  .gdj-board td.tl::after { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%233a8db5'><polygon points='40,12 60,12 50,0'/><polygon points='40,88 60,88 50,100'/><polygon points='12,40 12,60 0,50'/><polygon points='88,40 88,60 100,50'/></g></svg>"); }
  .gdj-board td.dw::after, .gdj-board td.center::after { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23f0a8a8'><polygon points='40,12 60,12 50,0'/><polygon points='40,88 60,88 50,100'/><polygon points='12,40 12,60 0,50'/><polygon points='88,40 88,60 100,50'/></g></svg>"); }
  .gdj-board td.tw::after { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23cc4040'><polygon points='40,12 60,12 50,0'/><polygon points='40,88 60,88 50,100'/><polygon points='12,40 12,60 0,50'/><polygon points='88,40 88,60 100,50'/></g></svg>"); }
  .gdj-board td.has-tile::after { content: none; }
  .gdj-board td.center:not(.has-tile)::before { content: "★"; position: relative; z-index: 2;
    font-size: calc(var(--cell) * .5); color: #111; }
  .tile { display: inline-flex; align-items: center; justify-content: center;
    background: #d8b975; color: #111; font-family: 'Inter', system-ui, sans-serif;
    font-weight: 700; position: relative; user-select: none;
    border: 0.5px solid #000; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .tile .val { position: absolute; bottom: 1px; right: 3px; font-size: .294em;
    font-family: 'Inter', system-ui, sans-serif; font-weight: 300; opacity: .8; }
  .tile.blank { color: #c8202a; }
  .tile.blank .val { display: none; }
  /* ../style.css fixe .tile à 24 × 24 px (jetons de l'accueil) : on l'annule ici */
  .gdj-board td .tile { position: absolute; inset: 0.25%; z-index: 8;
    width: auto; height: auto;
    font-size: calc(var(--cell) * .706); }
  .gdj-board td .tile.pending {
    background: linear-gradient(135deg, #e0f5e0, var(--tile-pending) 50%, var(--tile-pending-2));
    border-color: #5a9a5a; }
  .gdj-rack { display: flex; gap: 5px; margin: 12px 0 4px; }
  .gdj-rack .tile { width: 40px; height: 40px; font-size: 28px; }
  .gdj-find { display: flex; gap: 8px; margin: 12px 0; }
  .gdj-find input { flex: 1 1 auto; text-transform: uppercase; font-size: 1rem; }
  .gdj-msg { min-height: 1.3em; font-size: .9rem; margin-bottom: 8px; }
  .gdj-msg.ok { color: #1f6b47; font-weight: 600; }
  .gdj-msg.ko { color: #a3402e; }
  .gdj-list { list-style: none; margin: 0; padding: 0; }
  .gdj-list li { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px;
                 border-bottom: 1px solid var(--line); font-size: .92rem; }
  .gdj-list li.found { background: #eef6f1; }
  .gdj-list .w { font-weight: 700; font-family: 'Lora', serif; min-width: 7em; cursor: pointer; }
  .gdj-list .w.masked { color: transparent; background: #e6ecee; border-radius: 4px; cursor: default; }
  .gdj-list .pos { color: var(--ink-soft); font-size: .82rem; }
  .gdj-list .sc { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .gdj-list .var { color: var(--ink-soft); font-size: .78rem; }
</style>
</head>
<body>
<div class="gdj-wrap">
  <div class="gdj-top">
    <h1>🔎 Grille du jour</h1>
    <span class="gdj-sub" id="gdjSub">chargement du dictionnaire…</span>
  </div>
  <p class="gdj-sub" style="margin:0 0 14px">
    Trouve tous les scrabbles possibles — les coups qui posent les sept lettres et
    rapportent la prime de 50.
  </p>

  <div class="card">
    <div class="gdj-cols">
      <div>
        <div class="gdj-board" id="gdjBoard"></div>
        <div class="gdj-rack" id="gdjRack"></div>
      </div>
      <div>
        <div class="gdj-find">
          <input id="gdjInput" placeholder="un scrabble…" autocomplete="off" disabled>
          <button class="primary" id="gdjGo" disabled>Proposer</button>
        </div>
        <div class="gdj-msg" id="gdjMsg"></div>
        <ul class="gdj-list" id="gdjList"></ul>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn ghost small" id="gdjReveal" disabled>Tout révéler</button>
          <button class="btn ghost small" id="gdjNew" disabled>Nouvelle grille</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./grilledujour.js?v=374"></script>
</body>
</html>
