<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réinitialisation — La Garenna</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #f7f3ea;
         color: #002E44; display: flex; align-items: center; justify-content: center;
         min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
  .box { max-width: 460px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  #status { font-size: 1rem; margin: 16px 0; min-height: 1.4em; }
  .spin { display:inline-block; width:22px; height:22px; border:3px solid #cdd6da;
          border-top-color:#002E44; border-radius:50%; animation:r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  a.btn { display:inline-block; margin-top:10px; padding:10px 18px; border-radius:8px;
          background:#FFD23F; color:#002E44; text-decoration:none; font-weight:700; }
  .muted { color:#5a6a73; font-size:.85rem; margin-top:18px; }
</style>
</head>
<body>
  <div class="box">
    <h1>🧹 Réinitialisation de l'application</h1>
    <div id="status"><span class="spin"></span> Nettoyage en cours…</div>
    <div id="done" hidden>
      <p>✅ Cache et service worker purgés.</p>
      <a class="btn" href="./index.html">Revenir à l'accueil</a>
    </div>
    <p class="muted">Cette page supprime l'ancienne version mise en cache et force
    le rechargement du code à jour. À utiliser si l'application semble figée sur
    une vieille version.</p>
  </div>
<script>
(async () => {
  const status = document.getElementById("status");
  const done = document.getElementById("done");
  const log = [];
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister().catch(() => {})));
      log.push(regs.length + " service worker(s) désinscrit(s)");
    }
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k).catch(() => {})));
      log.push(keys.length + " cache(s) supprimé(s)");
    }
  } catch (e) {
    log.push("erreur : " + (e && e.message));
  }
  status.hidden = true;
  done.hidden = false;
  // Redirection auto vers l'accueil avec un paramètre anti-cache.
  setTimeout(() => { location.href = "./index.html?fresh=" + Date.now(); }, 1200);
})();
</script>
</body>
</html>
